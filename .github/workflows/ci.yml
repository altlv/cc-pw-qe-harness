name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Deterministic gate: fails the build on tests that assert nothing, use
      # banned waits, or carry unmarked fragile selectors. No API key needed.
      - name: Test quality gate
        run: npm run assert-quality

      - name: Install browsers
        run: npx playwright install --with-deps chromium

      - name: Playwright tests
        run: npm test

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Agent-backed checks cost tokens and need a secret, so they are a separate
  # job: a fork PR without the secret skips them instead of failing red.
  agents:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: verify
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check for API key
        id: key
        run: echo "present=${{ secrets.ANTHROPIC_API_KEY != '' }}" >> "$GITHUB_OUTPUT"

      - name: Agent smoke — triage a known failure
        if: steps.key.outputs.present == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AGENT_MAX_USD: '0.25'
        run: npm run triage -- examples/failure-403.json

      - name: Skipped
        if: steps.key.outputs.present != 'true'
        run: echo "ANTHROPIC_API_KEY not set — agent checks skipped."
